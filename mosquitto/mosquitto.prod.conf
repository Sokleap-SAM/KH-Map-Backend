# Production Mosquitto config — TEMPLATE.
#
# Mosquitto does not expand environment variables, but the go-auth plugin needs
# the shared secret inline. So this file is a template: the entrypoint renders
# it at container start and writes the real config. That keeps
# MQTT_AUTH_INTERNAL_SECRET in .env and out of git.
#
# Only MQTT_AUTH_INTERNAL_SECRET, API_INTERNAL_HOST and API_INTERNAL_PORT are
# substituted (named plainly here so this comment is not itself rewritten).
#
# ─── Why three listeners ─────────────────────────────────────────────────────
#
# mosquitto-go-auth cannot serve anonymous clients. Its C shim rejects any
# connection with a null username BEFORE calling into Go, and returns
# MOSQ_ERR_AUTH rather than MOSQ_ERR_PLUGIN_DEFER — so mosquitto never falls
# back to `allow_anonymous`, and no plugin option changes this:
#
#   auth-plugin.c:90   if (username == NULL || password == NULL) { ... }
#
# Rider apps must connect without a credential, so their listener cannot have
# the plugin loaded. `per_listener_settings true` makes allow_anonymous,
# acl_file and auth_plugin per-listener, which lets one broker serve both:
#
#   1883  private  MQTT    backend only          plugin
#   9001  public   ws      rider apps            NO plugin, anonymous read-only
#   9002  public   ws      driver apps           plugin
#
# The auth_opt_* block is repeated for each plugin listener because those
# options are per-listener too. Both copies are identical, which is what makes
# loading the plugin twice safe: each init overwrites the previous with the
# same values. Keep them in sync.
per_listener_settings true

# The entrypoint starts mosquitto as root so it can render this file and fix
# ownership; mosquitto then drops to this account before accepting traffic.
user mosquitto

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# ─── Listener 1883 — backend, private ────────────────────────────────────────
# Plain MQTT for the NestJS backend. Reachable only inside the private network:
# neither the prod compose file nor the ECS service definition exposes it, so
# nothing on the internet can reach it.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http

# Rendered by docker-entrypoint.sh. On compose these resolve to the "api"
# service; on ECS to the API service name in the Service Connect namespace.
# Hardcoding them would make the broker deny every client the moment it runs
# anywhere other than compose.
auth_opt_http_host ${API_INTERNAL_HOST}
auth_opt_http_port ${API_INTERNAL_PORT}

auth_opt_http_getuser_uri    /internal/mqtt-auth/user
auth_opt_http_superuser_uri  /internal/mqtt-auth/superuser
auth_opt_http_aclcheck_uri   /internal/mqtt-auth/acl

auth_opt_http_params_mode   json
auth_opt_http_response_mode status

# Shared secret presented on every auth request. The API's controller refuses
# any request without it, so the broker cannot authenticate users on its own
# even if it were compromised.
#
# Sent as User-Agent, which is not a stylistic choice. mosquitto-go-auth's HTTP
# backend sets exactly two headers — Content-Type and User-Agent — and only
# User-Agent is configurable. No released version (2.1.0 or 3.0.0) has an
# auth_opt_http_headers option, and mosquitto ignores unknown auth_opt_* keys
# without warning, so that spelling sent no credential at all and the API
# answered 401 to every request.
auth_opt_http_user_agent ${MQTT_AUTH_INTERNAL_SECRET}

# ─── Listener 9001 — rider apps, public, anonymous ───────────────────────────
# No auth_plugin here, deliberately. This is the only way anonymous clients can
# connect at all, and it is why anonymous.acl is finally consulted: mosquitto's
# own ACL handling applies precisely because no plugin is loaded on this
# listener to answer first.
#
# Read-only on transit/# — see anonymous.acl. A rider cannot publish anything,
# and cannot read driver topics.
listener 9001 0.0.0.0
protocol websockets
# Lets the ALB health-check this port with a plain HTTP GET. Without it a
# websockets listener closes a non-upgrade request without any HTTP response,
# the health check fails whatever the matcher, and ECS kills the task.
http_dir /mosquitto/www
allow_anonymous true
acl_file /mosquitto/config/anonymous.acl

# ─── Listener 9002 — driver apps, public, authenticated ──────────────────────
# Drivers were previously on 9001 alongside riders, which cannot work now that
# 9001 has no plugin: they would connect anonymously and be limited to reading
# transit/#. They get their own websocket listener instead, with the plugin, so
# each driver is still pinned to driver/<their-own-id>/location.
#
# The API tells the driver app which host to use (MQTT_BROKER_PUBLIC_HOST), so
# pointing apps here is an env change, not a client release.
listener 9002 0.0.0.0
protocol websockets
# Same as 9001: gives the ALB something that answers plain HTTP.
http_dir /mosquitto/www
allow_anonymous false

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http

auth_opt_http_host ${API_INTERNAL_HOST}
auth_opt_http_port ${API_INTERNAL_PORT}

auth_opt_http_getuser_uri    /internal/mqtt-auth/user
auth_opt_http_superuser_uri  /internal/mqtt-auth/superuser
auth_opt_http_aclcheck_uri   /internal/mqtt-auth/acl

auth_opt_http_params_mode   json
auth_opt_http_response_mode status

auth_opt_http_user_agent ${MQTT_AUTH_INTERNAL_SECRET}
