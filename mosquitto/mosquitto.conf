# Mosquitto config for the kh_map bus-position broker.
#
# Two ways to run this broker:
#
#   1. DEV   — anonymous publish/subscribe, single instance, no auth plugin.
#              Quick to iterate. Uncomment the DEV block below.
#
#   2. PROD  — mosquitto-go-auth plugin (HTTP backend) that calls our
#              NestJS API to authenticate connects and authorize each
#              publish/subscribe. Drivers can ONLY publish to
#              `driver/<their-id>/location`. The backend service account
#              has superuser. Anonymous reads on `transit/#` are allowed
#              for rider apps.
#
# Switch by commenting one block in and the other out, then restart the
# broker. The Docker image must include the go-auth plugin (see Dockerfile).

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Plain TCP MQTT for the NestJS publisher and any server-to-server clients.
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSocket for browsers and driver apps that prefer WS.
listener 9001 0.0.0.0
protocol websockets

# ─── DEV mode (default — do NOT use in production) ────────────────────────
allow_anonymous true

# ─── PROD mode ─────────────────────────────────────────────────────────────
# Uncomment the block below AND comment the DEV line above.
#
# allow_anonymous true
#
# # Riders / anonymous clients may only READ the public transit/# tree.
# # Anything else (publish to transit/#, publish/subscribe driver/#, etc.)
# # has no anonymous rule, so the plugin is consulted instead and denies.
# acl_file /mosquitto/config/anonymous.acl
#
# # mosquitto-go-auth plugin with HTTP backend.
# auth_plugin /mosquitto/go-auth.so
# auth_opt_backends http
# auth_opt_http_host kh_map_backend
# auth_opt_http_port 3000
# auth_opt_http_getuser_uri    /internal/mqtt-auth/user
# auth_opt_http_superuser_uri  /internal/mqtt-auth/superuser
# auth_opt_http_aclcheck_uri   /internal/mqtt-auth/acl
# auth_opt_http_params_mode  json
# auth_opt_http_response_mode status
# # Shared secret — must match MQTT_AUTH_INTERNAL_SECRET in the API env.
# # Mosquitto sends this on every auth request; the controller refuses
# # without it, so the broker can never authenticate users on its own.
# auth_opt_http_headers          authorization
# auth_opt_http_headers_authorization_value Bearer REPLACE_WITH_MQTT_AUTH_INTERNAL_SECRET
#
# # In PROD also set:
# #   listener 8883 0.0.0.0  protocol mqtt   (with cafile/certfile/keyfile)
# # so driver credentials don't traverse cleartext on cellular networks.

# Companion anonymous.acl (referenced above):
#   # anonymous.acl — rider apps and public consumers
#   pattern read transit/#
