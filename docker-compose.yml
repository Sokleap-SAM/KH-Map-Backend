
services:
  api:
    build:
      context: .
      target: development
    container_name: bus_api
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
      valhalla:
        condition: service_healthy
    networks:
      - bus_net

  mqtt:
    image: eclipse-mosquitto:2
    container_name: bus_mqtt
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - bus_net

  redis:
    image: redis:alpine
    container_name: bus_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bus_net

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: bus_valhalla
    ports:
      - "${VALHALLA_PORT}:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
      - valhalla_tiles:/valhalla/tiles
    restart: unless-stopped
    environment:
      - server_threads=4
      - tile_urls=
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s   # tile building can take a few minutes on first run
    networks:
      - bus_net

volumes:
  valhalla_tiles:
  mosquitto_data:
  mosquitto_log:

networks:
  bus_net:
    driver: bridge