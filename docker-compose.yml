
services:
  api:
    build:
      context: .
      target: development
    container_name: bus_api
    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"
    env_file:
      - .env
    volumes:
      - .:/usr/src/
      - /usr/src/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks:
      - bus_net

  mqtt:
    image: eclipse-mosquitto:2
    container_name: bus_mqtt
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - bus_net

  redis:
    image: redis:alpine
    container_name: bus_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # command: command: redis-server --requirepass ${REDIS_PASSWORD} --save ""
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bus_net

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: bus_valhalla
    ports:
      - "${VALHALLA_PORT}:8002"
    volumes:
      # Persists built tiles so they survive container restarts.
      # On first run, Valhalla will auto-build tiles from any .osm.pbf
      # files it finds inside /custom_files. Drop your Cambodia PBF there.
      # Download from: https://download.geofabrik.de/asia/cambodia-latest.osm.pbf
      - ./valhalla/custom_files:/custom_files
      - valhalla_tiles:/valhalla/tiles
    restart: unless-stopped
    environment:
      # Worker threads per service. Defaults to $(nproc) inside the image
      # (32 on this host), which spawns 32 workers for EACH of loki/thor/
      # odin/meili/tyr. Every worker opens several ZMQ sockets, and a ZMQ
      # context caps out at 1023 sockets -> zmq_socket() returns EMFILE and
      # Valhalla dies with "Too many open files" right after loading tiles.
      - server_threads=4
      # Build tiles automatically if none exist yet
      - tile_urls=
      # Use the PBF files in /custom_files instead of downloading
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      # Pedestrian-focused: keep all costing models but pedestrian is default
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
    healthcheck:
      # Valhalla's /status endpoint returns 200 once tiles are ready.
      # Must be curl — the image ships no wget, so the old probe always
      # errored and the container sat permanently "unhealthy" while serving
      # traffic perfectly well.
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s   # tile building can take a few minutes on first run
    networks:
      - bus_net

volumes:
  valhalla_tiles:
  mosquitto_data:
  mosquitto_log:

networks:
  bus_net:
    driver: bridge